  <!-- Project switcher -->
  <div class="px-3" x-data="{
      open: false,
      project: Mira.activeProject(),
      init() { window.addEventListener('mira:project', (e) => { this.project = e.detail; }); }
    }" @click.outside="open = false" @keydown.escape.prevent="open = false">
    <div class="relative">
      <button type="button" class="flex w-full items-center gap-2.5 rounded-lg border border-line bg-surface px-2.5 py-2 text-left transition hover:border-line-strong hover:bg-sunken" @click="open = !open" :aria-expanded="open" aria-haspopup="listbox">
        <span class="grid size-7 shrink-0 place-items-center rounded-md bg-primary-soft font-mono text-[10.5px] font-semibold text-link" x-text="project.initials"></span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-[13px] font-semibold leading-tight text-ink" x-text="project.name"></span>
          <span class="mt-1 flex items-center gap-1.5 text-[10.5px] leading-none text-muted">
            <span class="dot" :class="project.env === 'live' ? 'text-success' : 'text-warning'"></span>
            <span class="font-mono" x-text="project.env"></span>
            <span class="text-line-strong">&middot;</span>
            <span x-text="project.plan"></span>
          </span>
        </span>
        <i data-lucide="chevrons-up-down" class="size-3.5 shrink-0 text-muted"></i>
      </button>
      <div x-show="open" x-cloak x-transition.opacity.duration.120ms class="menu absolute left-0 right-0 top-[calc(100%+6px)] !min-w-0" role="listbox" aria-label="Switch project">
        <p class="px-2.5 pb-1 pt-1.5 text-[10px] font-semibold uppercase tracking-[0.1em] text-muted">Projects</p>
        <template x-for="p in Mira.projects" :key="p.id">
          <button type="button" class="menu-item" role="option" :aria-selected="p.id === project.id" @click="Mira.setProject(p.id); open = false">
            <span class="grid size-5 shrink-0 place-items-center rounded bg-sunken font-mono text-[9px] font-semibold" x-text="p.initials"></span>
            <span class="min-w-0 flex-1 truncate" x-text="p.name"></span>
            <span class="dot" :class="p.env === 'live' ? 'text-success' : 'text-warning'"></span>
          </button>
        </template>
        <div class="menu-sep"></div>
        <a class="menu-item" href="%BASE%app/projects.html"><i data-lucide="settings-2"></i>Manage projects</a>
